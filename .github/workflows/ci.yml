name: CI

# Runs the full monorepo test suite + an outer-seam install/self-test on every
# push and PR. This is the "CI regression test" the README refers to — it fails
# the build if any hardcoded user path leaks into packages/ (via the cli suite's
# test-no-identity-refs.js) or if any package's tests regress.
#
# WHY THE TESTS ARE SPLIT PER PACKAGE (2026-08-18)
# ------------------------------------------------
# This used to be a single `npm test` step (`npm run test --workspaces`). Every
# package's tests did run, but a failure anywhere produced one red check named
# only `test (node 20.x, ubuntu-latest)`. That is actively misleading: for weeks
# `main` was red purely because of 5 identity refs in output/ and oversight/,
# while telemetry passed 38/38 on all four matrix legs — and anyone opening a
# telemetry PR saw a red check named `test` and reasonably read it as "my tests
# failed". Confirming otherwise meant downloading raw logs and diffing failure
# counts against a main-branch run.
#
# Each package now gets its own step, so the failing step names the culprit, and
# a summary table lands in the run summary. Job count is unchanged (4 legs), so
# this costs no extra runner minutes.
#
# `if: always()` on each step -- NOT `continue-on-error: true`. Both let later
# steps run after a failure, but continue-on-error REWRITES the failing step's
# conclusion to "success" (the true result survives only in `outcome`, which the
# gate reads). Measured on the first attempt at this change: cli genuinely failed,
# the gate correctly caught it, and every per-package step still rendered GREEN in
# the UI -- which defeated the point, since the visible step names were then the
# one thing that did not identify the culprit. `if: always()` keeps each step's
# real red status while still running the rest.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHY A MATRIX-BUILDING JOB (2026-08-20)
  # -------------------------------------
  # Actions is free on public repos and BILLED on private ones, with Windows
  # runners charged at 2x the Linux rate. Measured on this repo before the change:
  # verify-install 21s + ubuntu 1m20 + 1m22 + windows 2m12 + 2m20, which is roughly
  # 17 billable minutes per run once per-job rounding and the 2x multiplier are
  # applied. At the observed ~15 runs/day that is ~250 min/day - enough to exhaust a
  # typical monthly allowance in 8-12 days.
  #
  # Windows is where this repo's real platform risk lives (path handling, PowerShell
  # quoting, MSYS argument mangling), so it is kept rather than dropped - but it only
  # needs to gate what LANDS. Ubuntu runs on every PR; Windows runs on pushes to main.
  #
  # Done by computing the matrix rather than duplicating the job, because Actions does
  # not support YAML anchors and the per-package step body below is long enough that
  # two copies would drift. Costs one ~5s ubuntu job; saves ~12 billable min per PR.
  matrix:
    name: choose matrix
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo "push to a protected branch - full matrix incl. Windows"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo "pull_request - Ubuntu only; Windows runs when this lands on main"
          fi

  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # OS list is event-dependent - see the `matrix` job above.
        # Node 20/22 both run everywhere the OS runs. The dashboard build (Vite 6 +
        # Tailwind v4) is validated on 20+; engines declares >=18 but the build
        # toolchain wants 20+.
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` runs the root `prepare` script, which builds both dashboard
      # bundles (v1 + v2) — so this also validates the Vite build.
      - name: Install (also builds dashboard via prepare)
        run: npm ci

      # One step per workspace. --if-present so packages without a test script
      # (shared, skills) are skipped rather than failing the leg.
      # The telemetry browser tier is intentionally not run here (it needs
      # Playwright browsers); `npm test` in that package is unit + integration.
      - name: Test — shared
        id: t_shared
        if: always()
        run: npm run test -w packages/shared --if-present
      - name: Test — oversight
        id: t_oversight
        if: always()
        run: npm run test -w packages/oversight --if-present
      - name: Test — output
        id: t_output
        if: always()
        run: npm run test -w packages/output --if-present
      - name: Test — skills
        id: t_skills
        if: always()
        run: npm run test -w packages/skills --if-present
      - name: Test — cli
        id: t_cli
        if: always()
        run: npm run test -w packages/cli --if-present
      - name: Test — telemetry
        id: t_telemetry
        if: always()
        run: npm run test -w packages/telemetry --if-present

      # Summarise every package's outcome, then fail the leg if any failed.
      # The gate is what keeps this equivalent to the old `npm test` — the
      # continue-on-error above only defers the failure, it never swallows it.
      - name: Summarise + gate
        if: always()
        shell: bash
        env:
          R_SHARED: ${{ steps.t_shared.outcome }}
          R_OVERSIGHT: ${{ steps.t_oversight.outcome }}
          R_OUTPUT: ${{ steps.t_output.outcome }}
          R_SKILLS: ${{ steps.t_skills.outcome }}
          R_CLI: ${{ steps.t_cli.outcome }}
          R_TELEMETRY: ${{ steps.t_telemetry.outcome }}
        run: |
          set -u
          failed=""
          {
            echo "### Test results by package"
            echo
            echo "| package | result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in "shared:$R_SHARED" "oversight:$R_OVERSIGHT" "output:$R_OUTPUT" \
                      "skills:$R_SKILLS" "cli:$R_CLI" "telemetry:$R_TELEMETRY"; do
            pkg="${pair%%:*}"; res="${pair##*:}"
            if [ "$res" = "success" ]; then icon=":white_check_mark:"
            elif [ "$res" = "skipped" ]; then icon=":fast_forward:"
            else icon=":x:"; failed="$failed $pkg"; fi
            echo "| \`$pkg\` | $icon $res |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            echo "**Failing package(s):**$failed" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Failing packages::$failed"
            echo "Failing package(s):$failed"
            exit 1
          fi
          echo "All packages passed." >> "$GITHUB_STEP_SUMMARY"

  verify-install:
    name: verify install + self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - name: Install (also builds dashboard via prepare)
        run: npm ci
      # Outer-seam check (the canonical verification per CLAUDE.md): install the
      # framework into a throwaway HOME, then run the deployed self-test from it.
      - name: Install to isolated HOME + self-test
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          export USERPROFILE="$HOME"
          mkdir -p "$HOME"
          node packages/cli/bin/rh-oversight.js init --workspace "$RUNNER_TEMP/ws" --yes
          node "$HOME/.claude/scripts/rh-oversight-self-test.js"
